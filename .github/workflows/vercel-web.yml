name: SEYSES Vercel Web CI

on:
  push:
    branches:
      - feat/vercel-nextjs-adaptacion
  pull_request:
    branches:
      - main
      - feat/supabase-auditoria

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
